<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Despacho">
<title>Consulta del despacho</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1f2328;--mute:#667085;--line:#e4e2dc;--acc:#1d4e5f}
@media (prefers-color-scheme:dark){:root{--bg:#15181b;--card:#1d2125;--ink:#e7e9ea;--mute:#9aa4ae;--line:#2e343a;--acc:#7cc4d6}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,system-ui,sans-serif}
#login{max-width:360px;margin:12vh auto 0;padding:0 18px}
#login h1{font-size:20px;margin:0 0 4px}
#login p{color:var(--mute);font-size:13px;margin:0 0 16px}
#login input[type=password]{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
#login label{display:flex;gap:8px;align-items:center;font-size:14px;margin:12px 0}
#login button,#barra button{font:inherit;font-size:15px;padding:10px 14px;border-radius:10px;border:1px solid var(--acc);background:var(--acc);color:#fff;cursor:pointer}
#login button{width:100%}
#msg{color:#b42318;font-size:13px;min-height:18px;margin-top:10px}
#barra{display:none;justify-content:flex-end;gap:8px;padding:10px 14px 0}
#barra button{background:transparent;color:var(--acc);padding:5px 10px;font-size:13px}
</style>
<style id="css"></style>
</head>
<body>
<div id="login">
  <h1>Consulta del despacho</h1>
  <p>Contenido cifrado. Introduce la contraseña.</p>
  <form id="f">
    <input id="pw" type="password" autocomplete="current-password" placeholder="Contraseña" required>
    <label><input id="rec" type="checkbox"> Recordar en este dispositivo</label>
    <button type="submit">Entrar</button>
  </form>
  <div id="msg"></div>
</div>
<div id="barra"><button id="ref" type="button">Actualizar</button><button id="out" type="button">Salir</button></div>
<div id="app" style="padding:0 14px 40px"></div>
<script>
(function(){
'use strict';
var USUARIO='Huan2670', REPO='consulta-despacho', RAMA='datos', ARCHIVO='consulta.enc';
var KEY='consulta_despacho_pw';
var $=function(id){return document.getElementById(id);};
function b64d(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k); if(v===null)localStorage.removeItem(k); else localStorage.setItem(k,v);}catch(e){return null;}}
async function descargar(){
  var url='https://api.github.com/repos/'+USUARIO+'/'+REPO+'/contents/'+ARCHIVO+'?ref='+RAMA+'&t='+Date.now();
  var r=await fetch(url,{headers:{'Accept':'application/vnd.github.raw'},cache:'no-store'});
  if(r.status===403||r.status===429) throw new Error('GitHub limita las consultas sin identificar (60 por hora). Espera unos minutos.');
  if(!r.ok) throw new Error('No se pudo descargar la consulta ('+r.status+').');
  return JSON.parse(await r.text());
}
async function descifrar(o,pw){
  var enc=new TextEncoder();
  var base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(o.s),iterations:o.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt;
  try{ pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(o.iv)},key,b64d(o.ct)); }
  catch(e){ throw new Error('Contraseña incorrecta.'); }
  var bytes=new Uint8Array(pt);
  if(o.gz){
    var ds=new DecompressionStream('gzip');
    var st=new Blob([bytes]).stream().pipeThrough(ds);
    return JSON.parse(await new Response(st).text());
  }
  return JSON.parse(new TextDecoder().decode(bytes));
}
function buscador(){
  var nz=function(s){return (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();};
  var els=[].slice.call(document.querySelectorAll('[data-s]'));
  els.forEach(function(e){e._s=nz(e.getAttribute('data-s')+' '+(e.tagName==='TR'?e.textContent:''));});
  var dets=[].slice.call(document.querySelectorAll('details'));
  dets.forEach(function(d){d.open=false;});
  var bus=$('bus'); if(!bus) return; bus.style.display='block';
  var q=$('q'), r=$('qr');
  q.addEventListener('input',function(){
    var t=nz(q.value.trim()).split(/\s+/).filter(Boolean), n=0, nd=[];
    els.forEach(function(e){ var ok=t.every(function(w){return e._s.indexOf(w)>=0;}); e.style.display=ok?'':'none'; if(ok&&t.length){n++; if(e.tagName==='DETAILS') nd.push(e);} });
    dets.forEach(function(d){d.open=false;});
    if(t.length && nd.length<=5) nd.forEach(function(d){d.open=true;});
    var on=t.length>0;
    [].slice.call(document.querySelectorAll('.cards,.tot,h4,section>p.m')).forEach(function(x){x.style.display=on?'none':'';});
    [].slice.call(document.querySelectorAll('section')).forEach(function(s){ var v=[].slice.call(s.querySelectorAll('[data-s]')).some(function(e){return e.style.display!=='none';}); s.style.display=(on&&!v)?'none':''; });
    [].slice.call(document.querySelectorAll('section table')).forEach(function(tb){ var v=[].slice.call(tb.querySelectorAll('tr[data-s]')); if(!v.length) return; tb.style.display=(on&&!v.some(function(e){return e.style.display!=='none';}))?'none':''; });
    r.textContent=on?(n+' resultado'+(n===1?'':'s')):'';
  });
}
async function abrir(pw,recordar){
  $('msg').style.color='var(--mute)'; $('msg').textContent='Descargando y descifrando...';
  var o=await descargar();
  var d=await descifrar(o,pw);
  if(recordar) ls(KEY,pw);
  $('css').textContent=d.css;
  $('app').innerHTML=d.body;
  $('login').style.display='none'; $('barra').style.display='flex';
  buscador();
  window._pw=pw;
}
$('f').addEventListener('submit',function(ev){
  ev.preventDefault();
  abrir($('pw').value,$('rec').checked).catch(function(e){$('msg').style.color='';$('msg').textContent=e.message;});
});
$('ref').addEventListener('click',function(){ var y=window.scrollY; abrir(window._pw,false).then(function(){window.scrollTo(0,y);}).catch(function(e){alert(e.message);}); });
$('out').addEventListener('click',function(){ ls(KEY,null); window._pw=null; $('app').innerHTML=''; $('css').textContent=''; $('barra').style.display='none'; $('login').style.display='block'; $('pw').value=''; $('msg').textContent=''; });
var g=ls(KEY);
if(g){ abrir(g,false).catch(function(e){ if(/incorrecta/.test(e.message)) ls(KEY,null); $('msg').style.color=''; $('msg').textContent=e.message; }); }
})();
</script>
</body>
</html>
